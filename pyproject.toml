[project]
name = "voiceMonitor"
version = "1.1.0"
description = "Real-Time Vocal Fatigue Monitoring for Continuous Speech Analytics"
readme = "README.md"
authors = [
  { name="Muhammad Khubaib Ahmad", email="khubaib.ahmad@inference-lab.org" }
]
maintainers = [
  { name="INFERENCE Lab" }
]
license = { text="MIT" }

requires-python = ">=3.10"
dependencies = [
    "auralis-vfs>=1.1.0",
    "sounddevice>=0.4",
    "pydub>=0.25",
    "soundfile>=0.12",
    "tqdm>=4.65",
    "praat-parselmouth>=0.4"
]

[project.scripts]
voicemonitor = "voiceMonitor.cli:main"